<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1780" viewBox="0 0 1200 1780"><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#204d40}.h{font-size:28px;font-weight:bold}.b{font-size:18px}.s{font-size:15px}</style><rect width="1200" height="1780" fill="#f5f7f3"/><text x="45" y="60" class="h">三角色 · 从学期配置到学生报告</text><rect x="170" y="90" width="310" height="60" rx="10" fill="#dcece3"/><text x="185" y="128" class="b">管理员：组织与治理</text><rect x="500" y="90" width="310" height="60" rx="10" fill="#e0e9f2"/><text x="515" y="128" class="b">教师：激励与核验</text><rect x="830" y="90" width="310" height="60" rx="10" fill="#f6edd8"/><text x="845" y="128" class="b">学生：参与与成长</text><text x="28" y="230" class="b">01 学校准备</text><rect x="170" y="180" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="240" class="s">学期、指标、规则</text><rect x="500" y="180" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="240" class="s">任教班级与主教学科</text><rect x="830" y="180" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="240" class="s">核对身份与班级</text><text x="600" y="328" class="b">↓</text><text x="28" y="395" class="b">02 自动发卡</text><rect x="170" y="345" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="405" class="s">学科策略 → 月配卡 → PDF</text><rect x="500" y="345" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="405" class="s">查看本人卡 → 线下发卡</text><rect x="830" y="345" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="405" class="s">扫码预览 → 取消 / 确认</text><text x="600" y="493" class="b">↓</text><text x="28" y="560" class="b">03 过程激励</text><rect x="170" y="510" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="570" class="s">误评冲销 → 审计</text><rect x="500" y="510" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="570" class="s">两级归类审核 + 无卡直评</text><rect x="830" y="510" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="570" class="s">积分账本：18 → 20</text><text x="600" y="658" class="b">↓</text><text x="28" y="725" class="b">04 荣誉闭环</text><rect x="170" y="675" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="735" class="s">核对材料与版本</text><rect x="500" y="675" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="735" class="s">退回 → 再审 → 认定6分</text><rect x="830" y="675" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="735" class="s">v1申报 → 补交v2</text><text x="600" y="823" class="b">↓</text><text x="28" y="890" class="b">05 故事闭环</text><rect x="170" y="840" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="900" class="s">确认评分来源</text><rect x="500" y="840" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="900" class="s">阅读修订 → 正式评分88.5</text><rect x="830" y="840" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="900" class="s">草稿 → 修订提交 → 反馈</text><text x="600" y="988" class="b">↓</text><text x="28" y="1055" class="b">06 期末成绩</text><rect x="170" y="1005" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="1065" class="s">六育缺项 → 补齐</text><rect x="500" y="1005" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="1065" class="s">学科Excel → 预览 → 导入</text><rect x="830" y="1005" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="1065" class="s">查看独立成绩来源</text><text x="600" y="1153" class="b">↓</text><text x="28" y="1220" class="b">07 核算发布</text><rect x="170" y="1170" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="1230" class="s">核算90.50 → 发布快照</text><rect x="500" y="1170" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="1230" class="s">核对来源、材料与待办</text><rect x="830" y="1170" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="1230" class="s">完整评价 → 报告 → 打印</text><text x="600" y="1318" class="b">↓</text><text x="28" y="1385" class="b">08 追溯归档</text><rect x="170" y="1335" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="185" y="1395" class="s">审计、权限、版本核查</text><rect x="500" y="1335" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="515" y="1395" class="s">教师责任与反馈闭环</text><rect x="830" y="1335" width="310" height="120" rx="12" fill="white" stroke="#bccfc3"/><text x="845" y="1395" class="s">成长证据与学期结论</text><text x="600" y="1483" class="b">↓</text><text x="45" y="1570" class="b">异常回路：缺项 → 补齐；荣誉退回 → 修订；误评 → 冲销；打印失败 → 重试</text><text x="45" y="1620" class="s">学科成绩与六育终测独立；故事建议为规则模拟；报告以真实HTML打印视图交付。</text><text x="45" y="1670" class="s">先生成资料 → MCP逐步实测 → 独立对账 → 缺陷修复复测 → 保留证据与终态</text><text x="45" y="1720" class="s">所有师生、活动、证书均为虚构演示样本；流程图不是测试通过证明。</text></svg>