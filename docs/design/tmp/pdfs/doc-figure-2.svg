<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 550" role="img" aria-label="系统结构与业务关系图 2"><defs><marker id="diagram-arrow-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#888780"/></marker></defs><rect width="840" height="550" fill="white"/><text x="420" y="29" font-size="16" fill="#0C447C" text-anchor="middle">现有架构：React 单页前端 + Express 单体后端 + MySQL</text><rect x="24" y="55" width="232" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width=".8"/><text x="140.0" y="80" font-size="14" fill="#185FA5" text-anchor="middle">学生入口</text><text x="140.0" y="102" font-size="11" fill="#185FA5" text-anchor="middle">扫码申领 / 账本 / 荣誉 / 故事</text><path d="M140 125V147H420V168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#diagram-arrow-2)"/><rect x="304" y="55" width="232" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width=".8"/><text x="420.0" y="80" font-size="14" fill="#185FA5" text-anchor="middle">教师入口</text><text x="420.0" y="102" font-size="11" fill="#185FA5" text-anchor="middle">扫卡审核 / 直评 / 材料评阅</text><path d="M420 125V147H420V168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#diagram-arrow-2)"/><rect x="584" y="55" width="232" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width=".8"/><text x="700.0" y="80" font-size="14" fill="#185FA5" text-anchor="middle">管理员入口</text><text x="700.0" y="102" font-size="11" fill="#185FA5" text-anchor="middle">学期 / 卡片 / 导入 / 发布</text><path d="M700 125V147H420V168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#diagram-arrow-2)"/><rect x="230" y="170" width="380" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width=".8"/><text x="420.0" y="195" font-size="14" fill="#185FA5" text-anchor="middle">前端请求与入口</text><text x="420.0" y="217" font-size="11" fill="#185FA5" text-anchor="middle">HashRouter / Axios / Bearer JWT</text><text x="420.0" y="238" font-size="11" fill="#185FA5" text-anchor="middle">开发：Vite 代理；镜像：Nginx 静态服务</text><path d="M420 238V270" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#diagram-arrow-2)"/><rect x="70" y="272" width="700" height="97" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width=".8"/><text x="420.0" y="297" font-size="14" fill="#185FA5" text-anchor="middle">Express 应用（同一 Node.js 进程）</text><text x="420.0" y="319" font-size="11" fill="#185FA5" text-anchor="middle">路由 / 身份与角色中间件 / Controller / mysql2 连接池</text><text x="420.0" y="340" font-size="11" fill="#185FA5" text-anchor="middle">评分引擎 evaluationEngine；定时器 scheduler；统一响应与日志</text><path d="M420 369V402" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#diagram-arrow-2)"/><rect x="70" y="405" width="330" height="87" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".8"/><text x="235.0" y="430" font-size="14" fill="#0F6E56" text-anchor="middle">MySQL / InnoDB</text><text x="235.0" y="452" font-size="11" fill="#0F6E56" text-anchor="middle">仓库 DDL：16 张核心业务表</text><text x="235.0" y="473" font-size="11" fill="#0F6E56" text-anchor="middle">另有 token_blacklist 技术表</text><rect x="440" y="405" width="330" height="87" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width=".8"/><text x="605.0" y="430" font-size="14" fill="#854F0B" text-anchor="middle">进程内后台任务</text><text x="605.0" y="452" font-size="11" fill="#854F0B" text-anchor="middle">10 分钟卡片过期扫描</text><text x="605.0" y="473" font-size="11" fill="#854F0B" text-anchor="middle">30 秒 Outbox 扫描（模拟投递）</text><path d="M770 322H806V448H771" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#diagram-arrow-2)"/><text x="420" y="526" font-size="12" fill="#888780" text-anchor="middle">未接入：独立 Worker、真实 LLM、对象存储、钉钉同步、异步 PDF 服务。</text></svg>