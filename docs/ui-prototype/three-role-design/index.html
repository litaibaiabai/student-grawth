<header class="designbar"><div><strong>云美 · 三角色界面提案</strong><small>首页与关键交互示意</small></div><div class="role-switch" role="tablist" aria-label="切换角色预览"><button role="tab" aria-selected="true" data-role="student" onclick="setRole('student')">学生 / 家长</button><button role="tab" aria-selected="false" data-role="teacher" onclick="setRole('teacher')">教师</button><button role="tab" aria-selected="false" data-role="manager" onclick="setRole('manager')">管理员</button></div></header>

<script>
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const brand=()=>`<div class="brand"><svg class="brand-cloud" aria-hidden="true"><use href="#cloud"/></svg><div><strong>云美</strong><small>让成长被看见</small></div></div>`;
const mascot=`<svg class="mascot" viewBox="0 0 300 220" aria-hidden="true"><path d="M23 177q90-14 253 6" fill="none" stroke="#e0c79a" stroke-width="3" stroke-linecap="round"/><circle cx="243" cy="37" r="24" fill="#f6cb78"/><path d="m242 3 2-7m29 19 7-4m-6 28 9 1m-64-21-6-5" stroke="#e7ba62" stroke-width="3" stroke-linecap="round"/><path d="M49 139q-27-8-15-36 7-13 22-13-1-34 33-40 32-8 43 15 35-13 48 18 26-3 31 24 9 31-19 38Z" fill="#fffdf5" stroke="#698e71" stroke-width="2.5"/><ellipse cx="82" cy="107" rx="4.5" ry="6" fill="#3e6350"/><ellipse cx="132" cy="107" rx="4.5" ry="6" fill="#3e6350"/><ellipse cx="68" cy="120" rx="10" ry="5" fill="#f3c1a8"/><ellipse cx="146" cy="120" rx="10" ry="5" fill="#f3c1a8"/><path d="M98 121q10 11 20 0" fill="none" stroke="#3e6350" stroke-width="2.5" stroke-linecap="round"/><path d="m81 144 2 27m48-28-2 28" stroke="#698e71" stroke-width="5" stroke-linecap="round"/><path d="m65 145-15 11m108-16 17 11" stroke="#698e71" stroke-width="4" stroke-linecap="round"/><path d="m66 172 20-2m42 0 22 2" stroke="#7d9b6f" stroke-width="6" stroke-linecap="round"/><g transform="translate(179,113) rotate(12)"><rect x="0" y="0" width="54" height="63" rx="5" fill="#82af93" stroke="#5f8c70" stroke-width="2"/><path d="M8 0v63" stroke="#5f8c70" stroke-width="2"/><rect x="17" y="13" width="27" height="18" rx="2" fill="#fff8df"/><path d="M22 20h16m-16 5h11" stroke="#c2a364" stroke-width="1.5"/></g><g transform="translate(237,94) rotate(26)"><path d="M0 8h13v63L7 85 0 71Z" fill="#efbd68" stroke="#b58b4c" stroke-width="1.7"/><path d="M0 8Q0 0 7 0q6 0 6 8" fill="#e69d8a" stroke="#b58b4c" stroke-width="1.7"/><path d="M0 71h13L7 85Z" fill="#fae6b9"/><path d="m5 81 2 4 2-4" fill="#4c6453"/></g><path d="m28 55 5 7 9 1-7 5 1 9-7-5-8 3 3-9-5-6 9 1Z" fill="#d7b36e"/><path d="m192 36 3 5 7 1-5 4v6l-5-3-5 2 1-6-3-5 6 1Z" fill="#b7c797"/></svg>`;
let role='student',studentPage='home',returnFocus=null;
function setRole(next){role=next;studentPage='home';document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.role===role)));render();document.title=`云美 · ${role==='student'?'学生':role==='teacher'?'教师':'管理员'}界面提案`;}
function studentNav(cls){return `<nav class="${cls}" aria-label="学生导航"><button class="${studentPage==='home'?'active':''}" onclick="showStudent('home')">${cls==='student-navigator'?icon('home'):''}首页</button><button class="${studentPage==='story'?'active':''}" onclick="showStudent('story')">${cls==='student-navigator'?icon('book'):''}月度故事</button><button class="${studentPage==='archive'?'active':''}" onclick="showStudent('archive')">${cls==='student-navigator'?icon('report'):''}我的档案</button></nav>`;}
function showStudent(page){studentPage=page;render();}
function student(){let content;if(studentPage==='home')content=`<div class="student-hero"><div><div class="eyebrow">成长手账 · 2026 秋</div><h1>嗨，小满，<br>今天也闪闪发光！</h1><p>一次小小的努力，都值得被认真记下。</p><span class="hero-chip">本月还有 1 项故事待完成</span></div>${mascot}</div><div class="action-pair"><button class="action-tile" onclick="openClaim()"><span class="tile-icon">${icon('scan')}</span><span><b>领取积分卡</b><small>打开扫码链接，确认就记分</small></span><span class="tile-arrow">↗</span></button><button class="action-tile award" onclick="openAward()"><span class="tile-icon">${icon('award')}</span><span><b>上传奖状</b><small>选一张清晰的奖状照片</small></span><span class="tile-arrow">↗</span></button></div><div class="student-bottom"><section class="card"><div class="card-title"><h2>我的 10 月故事</h2><span class="badge orange">还差讲故事</span></div><p class="caption">读、听、讲，每类 1 篇就可以一起提交。</p><div class="story-track"><span>读故事 · 1 篇</span><span>听故事 · 1 篇</span><span class="pending">讲故事 · 未填</span></div><div class="foot"><button class="primary" onclick="showStudent('story')">继续填写 →</button><small>一次提交整月内容</small></div></section><section class="card"><div class="card-title"><h2>给自己点星星</h2><span class="badge blue">学期自评</span></div><p class="caption">想想自己的收获，再写下一个小目标。</p><div class="small-illustration"><button class="text-action" onclick="openSelf()">开始自我评价 →</button><svg viewBox="0 0 100 85" aria-hidden="true"><path d="m50 7 11 22 25 3-18 18 4 25-22-12-23 12 5-25L13 32l25-3Z" fill="#f3d58f" stroke="#bba265" stroke-width="2"/><path d="M38 40h.1m25 0h.1" stroke="#8d7950" stroke-width="5" stroke-linecap="round"/><path d="M43 51q8 8 15 0" fill="none" stroke="#8d7950" stroke-width="2" stroke-linecap="round"/></svg></div></section></div>`;
else if(studentPage==='story')content=`<section class="card form-demo"><div class="card-title"><h2>我的 10 月故事</h2><span class="badge orange">有未保存的修改</span></div><p class="caption">每类填写 1–3 篇。先完成这三件小事，再一起提交。</p><div class="story-tabs" role="tablist" aria-label="故事分类"><button class="active" onclick="storyTab(this,'读故事')">读故事 · 1 篇</button><button onclick="storyTab(this,'听故事')">听故事 · 1 篇</button><button onclick="storyTab(this,'讲故事')">讲故事 · 未填</button></div><label><span id="storyHeading">我爱读故事 · 第 1 篇</span><textarea placeholder="把读过的故事、自己的理解或感受写在这里。也可以直接粘贴文字。">我读了《小马过河》，明白了听取建议以后，还需要自己动脑思考。</textarea></label><div class="compact-links"><button onclick="toast('正式版可选择 TXT 文件，回显到当前文本框后再编辑')">从 TXT 载入</button><button onclick="toast('此类最多添加 3 篇；新增篇目将沿用当前分类')">＋ 再加一篇</button></div><div class="story-submit"><span>读 1 篇 · 听 1 篇 · 讲 0 篇</span><div class="button-line"><button class="secondary" onclick="toast('演示：保存成功后，状态才会变为“草稿已保存”')">保存草稿</button><button class="primary" onclick="toast('请先完成讲故事：每类至少 1 篇即可整月提交')">提交本月故事</button></div></div></section>`;
else if(studentPage==='self')content=renderSelfForm();
else content=`<section class="card"><div class="card-title"><h2>我的学期档案</h2><span class="badge">2026 秋</span></div><p class="caption">自己的评价、已提交材料与期末报告，都放在这里。</p><div class="task-row"><div><b>学期自我评价</b><small>填写自己的收获与下学期目标</small></div><button class="secondary" onclick="openSelf()">去填写</button></div><div class="task-row"><div><b>我上传的奖状</b><small>1 份已认定 · 1 份待认定</small></div><button class="secondary" onclick="toast('材料记录以状态分组：处理中、已认定、需补充')">查看记录</button></div><div class="task-row"><div><b>六育期末报告</b><small>学校统一发布后可查看与打印</small></div><button class="secondary" onclick="toast('报告保持学校 PDF 原有六板块排版，不使用卡通打印模板')">查看说明</button></div></section>`;
return `<div class="student"><header class="student-header">${brand()}${studentNav('student-topnav')}<div class="avatar"><div class="avatar-dot">满</div><span class="desktop-only">四年级（2）班 · 林小满</span></div></header><main class="student-content">${content}<div class="student-footer">慢慢长大，每一小步都算数。</div></main>${studentNav('student-navigator')}</div>`;}
function adultShell(type,body){const isTeacher=type==='teacher',items=isTeacher?[['grid','工作台'],['edit','评价录入'],['card','卡片管理'],['report','班级报告']]:[['grid','发布中心'],['upload','数据与额度'],['settings','学期配置']];return `<div class="adult"><aside class="sidebar">${brand()}<div class="side-caption">${isTeacher?'教师工作区':'学校管理'}</div><nav aria-label="${isTeacher?'教师':'管理员'}导航">${items.map(([i,n],index)=>`<button class="${index===0?'active':''}" onclick="adultNav(this,'${type}','${n}')">${icon(i)}${n}${n==='班级报告'?'<small style="font-size:8px;color:#94a480">班主任</small>':''}</button>`).join('')}</nav><div class="sidebar-note">有故事的学校<br>有温度的教育<br>有精彩的童年</div><div class="side-user"><div class="avatar-dot">${isTeacher?'陈':'校'}</div><div>${isTeacher?'陈老师':'学校管理员'}<small>${isTeacher?'语文教师 · 班主任':'全校期末评价'}</small></div></div></aside><main class="adult-main"><header class="adult-head"><div><div class="eyebrow">${isTeacher?'把精力留给学生':'全校评价 · 有序归档'}</div><h1>${isTeacher?'今天，先把这几件事做完':'全校发布进度'}</h1></div><div class="head-meta"><span>2026 年 10 月 28 日 · 星期三</span><select class="term-select" aria-label="当前学期"><option>2026—2027 · 第一学期</option></select></div></header>${body}<footer class="adult-footer"><span>云美 · 学校期末评价</span><span>${isTeacher?'仅显示本人负责班级与学科':'完成情况可见，学生报告正文受权限保护'}</span></footer></main></div>`;}
function teacher(){return adultShell('teacher',`<div class="context-bar"><div class="context-controls"><label>当前工作范围</label><select aria-label="选择班级"><option>四年级（2）班</option><option>四年级（1）班</option></select><select aria-label="选择任教学科"><option>语文</option><option>道德与法治</option></select></div><span>下次打开会记住当前范围</span></div><div class="stats"><div class="stat"><small>本班学生</small><span class="stat-icon">${icon('people')}</span><b>38</b><span>四年级（2）班</span></div><div class="stat warm"><small>需要我处理</small><span class="stat-icon">${icon('edit')}</span><b>9<span style="font-size:12px;margin-left:6px">项</span></b><span>6 份奖状 · 3 篇故事异常</span></div><div class="stat"><small>本学科录入</small><span class="stat-icon">${icon('check')}</span><b>32<span style="font-size:13px;margin-left:5px">/ 38</span></b><span>6 名学生待补齐</span></div></div><div class="section-heading"><h2>常用操作</h2><span>选好班级，直接开始</span></div><div class="task-grid"><div class="task-row"><div class="task-label"><span class="task-symbol">${icon('edit')}</span><div><b>快速直评</b><small>多选学生，一次记分</small></div></div><button class="secondary" onclick="openScore()">＋ 记 1 分</button></div><div class="task-row"><div class="task-label"><span class="task-symbol">${icon('upload')}</span><div><b>录入学业水平</b><small>按班整表录入，支持 Excel</small></div></div><button class="secondary" onclick="openImport()">继续录入</button></div></div><section class="table-panel"><div class="section-heading"><h2>待办事项 <span class="count-pill">9</span></h2><div class="filters"><button class="selected">全部</button><button>奖状 6</button><button>故事 3</button></div></div><table><thead><tr><th>学生</th><th>需要处理</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>林小满<small>　四（2）班</small></td><td>劳动实践奖状</td><td><span class="badge orange">待认定</span></td><td><button class="text-action" onclick="openReview()">查看认定 →</button></td></tr><tr><td>张予安<small>　四（2）班</small></td><td>10 月 · 我爱讲故事</td><td><span class="badge orange">评分异常</span></td><td><button class="text-action" onclick="openReview('story')">处理异常 →</button></td></tr><tr><td>沈知夏<small>　四（2）班</small></td><td>阅读活动奖状</td><td><span class="badge orange">待认定</span></td><td><button class="text-action" onclick="openReview()">查看认定 →</button></td></tr></tbody></table><div class="table-footer"><span>优先显示阻碍报告完成的事项</span><button onclick="toast('待办按当前班级与学科分页，不混入其他班级材料')">查看全部待办 →</button></div></section><div class="mock-navigation-note">期末时，“班级报告”集中显示缺项、寄语与待确认学生；不需要在多个菜单中来回找。</div>`);}
function manager(){return adultShell('manager',`<div class="school-overview"><div><h2>让每一份报告，都准备妥当</h2><p>先处理缺项与异常，再由学校一次性统一发布。</p></div><button class="secondary" onclick="openImport('health')">${icon('upload')}导入体测数据</button></div><div class="stats"><div class="stat"><small>全校适用学生</small><span class="stat-icon">${icon('people')}</span><b>480</b><span>12 个班级</span></div><div class="stat"><small>已由班主任确认</small><span class="stat-icon">${icon('check')}</span><b>452</b><span>报告就绪</span></div><div class="stat warm"><small>尚待完成</small><span class="stat-icon">${icon('edit')}</span><b>28</b><span>已按班级汇总负责人</span></div></div><div class="release-steps"><div class="release-step"><span class="step-dot">✓</span>基础资料就绪</div><div class="release-step current"><span class="step-dot">2</span>补齐数据与确认</div><div class="release-step"><span class="step-dot">3</span>准备全校报告</div><div class="release-step"><span class="step-dot">4</span>统一发布</div></div><section class="table-panel"><div class="section-heading"><h2>按班查看未完成事项</h2><span>不展示学生报告正文</span></div><table><thead><tr><th>班级 / 班主任</th><th>主要待办</th><th>待完成学生</th><th>操作</th></tr></thead><tbody><tr><td>四年级（2）班<small>　陈老师</small></td><td>故事异常 · 奖状待认定</td><td><span class="badge orange">9 人</span></td><td><button class="text-action" onclick="openClass()">查看缺项 →</button></td></tr><tr><td>三年级（1）班<small>　周老师</small></td><td>体测原始数据缺失</td><td><span class="badge orange">12 人</span></td><td><button class="text-action" onclick="openImport('health')">去导入 →</button></td></tr><tr><td>五年级（3）班<small>　李老师</small></td><td>班主任尚未确认</td><td><span class="badge orange">7 人</span></td><td><button class="text-action" onclick="openClass()">查看完成状态 →</button></td></tr></tbody></table><div class="table-footer"><span>452 / 480 份报告已就绪 · 补齐后自动重新检查</span><button onclick="toast('刷新完成状态，不读取学生健康原值、故事或寄语正文')">重新检查</button></div></section><div class="context-bar" style="margin-top:18px"><div><div class="field-title" style="margin:0">全校报告尚未全部就绪</div><small style="font-size:10px;color:#8c997f">还有 28 名学生待处理。系统会逐项说明阻断原因。</small></div><button class="primary" disabled>准备全校报告</button></div>`);}
function render(){
 document.getElementById('frame').innerHTML=role==='student'?student():role==='teacher'?(reportUI.open?renderReportWorkspace():cardUI.open?renderCardsPage():directState.open?renderDirectPage():teacher()):manager();
 if(role==='teacher'){document.querySelectorAll('.sidebar nav button').forEach(button=>{const label=button.textContent.trim();if(label.startsWith('班级报告'))button.querySelector('small')?.remove();if(reportUI.open||cardUI.open||directState.open)button.classList.toggle('active',reportUI.open?label.startsWith('班级报告'):label===(cardUI.open?'卡片管理':'评价录入'));const original=button.onclick;button.onclick=function(){if(label.startsWith('班级报告')){openReportWorkspace();return;}reportUI.open=false;if(label==='卡片管理'){openCardLedger();return;}cardUI.open=false;directState.open=false;original.call(this)};});}
 if(role==='teacher'&&reportUI.open&&reportUI.studentId)mountReportExample();
 document.querySelectorAll('.self-text label textarea').forEach(area=>area.parentElement.after(area));
 const family=document.getElementById('text-family_message');
 if(family){family.maxLength=1000;document.getElementById('count-family_message').textContent=[...family.value].length+' / 1000';}
 document.querySelectorAll('.star-row').forEach(row=>{const key=row.id.slice('self-row-'.length);const clear=document.createElement('button');clear.type='button';clear.className='text-action';clear.style.cssText='font-size:12px;min-height:44px';clear.textContent='清除本项';clear.setAttribute('aria-label',row.querySelector('.star-name b').textContent+' 清除自评');clear.onclick=()=>setSelfStar(key,null);row.querySelector('.star-name').append(clear);});
}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('visible'),3600);}
function openModal(title,body,primary='确认',message='交互演示已完成；没有写入真实业务数据'){returnFocus=document.activeElement;document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;const button=document.getElementById('modalPrimary');button.textContent=primary;button.dataset.message=message;button.disabled=false;button.onclick=confirmDemo;const back=document.querySelector('.modal>.button-line>button:first-child');back.textContent='返回';back.onclick=closeModal;document.querySelector('.modal').classList.remove('direct-mode');document.getElementById('modal').classList.add('open');document.querySelector('.modal').focus();}
function closeModal(){document.getElementById('modal').classList.remove('open','ledger-print');document.querySelector('.modal').classList.remove('direct-mode');returnFocus?.focus();}
function confirmDemo(){const message=document.getElementById('modalPrimary').dataset.message;closeModal();toast(message);}
function openClaim(){openModal('这张卡，属于你的努力',`<p>扫码链接打开后直接识别卡片，无需再次选方向或点击“读取”。</p><div class="story-track"><div><div class="field-title">四年级（2）班 · 有礼貌</div><span style="font-size:12px">本次领取：＋1 分</span></div></div><p>只需确认一次。网络重试不会重复记分。</p>`,'确认领取 ＋1','领取成功示意：原位置显示结果，不再弹出第二层确认');}

function openSelf(){openModal('给自己的学期点星星',`<p>按“行为自评 → 学习与特长 → 收获与目标”分组。一次只展开当前组。</p><div class="task-row"><span>有礼貌</span><div class="pick-list" role="group" aria-label="有礼貌自评">${[1,2,3].map(n=>`<button aria-pressed="false" onclick="pickStar(this)" aria-label="${n}星">${'★'.repeat(n)}</button>`).join('')}</div></div><div class="form-demo"><label>下学期，我想试着……<textarea placeholder="写下一个自己的小目标"></textarea></label></div>`,'保存并继续','自评保存示意：保留已填项目，跳到下一组，不重复填写他评');}
function pickStar(button){button.parentElement.querySelectorAll('button').forEach(b=>{b.classList.remove('chosen');b.setAttribute('aria-pressed','false')});button.classList.add('chosen');button.setAttribute('aria-pressed','true');}
function storyTab(button,label){button.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');document.getElementById('storyHeading').textContent='我爱'+label+' · 第 1 篇';}
const directHierarchy=[
 {id:'conduct',name:'德美少年',groups:[{name:'日常行为',items:['有礼貌','讲文明','讲信用','负责任','有爱心','守规则','善交流','会合作']}]},
 {id:'wisdom',name:'智美少年',groups:['道德与法治','语文','数学','科学','英语'].map(name=>({name,items:['学习兴趣','学习习惯','学习方法','过程表现']}))},
 {id:'health',name:'健美少年',groups:[{name:'体育与健康',items:['过程表现']},{name:'体质健康测试',items:['体测水平','过程表现']}]},
 {id:'art',name:'艺美少年',groups:['音乐','美术'].map(name=>({name,items:['学科素养教师评价','学科素养过程表现','艺术技能教师评价']}))},
 {id:'labor',name:'劳美少年',reason:'由学业导入和奖状生成，不进行卡式直评',groups:[]},
 {id:'story',name:'故事美少年',reason:'由月度故事评分和奖状生成，不进行卡式直评',groups:[]}
];
const directStudents={'四年级（2）班':[{id:'s1',name:'林小满'},{id:'s2',name:'张予安'},{id:'s3',name:'沈知夏'}],'四年级（1）班':[{id:'s4',name:'刘安安'},{id:'s5',name:'方沐阳'},{id:'s6',name:'周星禾'}]};
let directState={};
function directAllowed(group){return ['日常行为','道德与法治','语文'].includes(group.name);}
function openScore(){reportUI.open=false;cardUI.open=false;directState={open:true,students:[],className:'四年级（2）班',section:null,group:null,item:null,reason:'',success:''};renderDirect();window.scrollTo(0,0);}
function directResetPath(){directState.section=null;directState.group=null;directState.item=null;}
function directChangeClass(value){directState.className=value;directState.students=[];directResetPath();renderDirect();}
function directToggleStudent(id){directState.students=directState.students.includes(id)?directState.students.filter(x=>x!==id):[...directState.students,id];directResetPath();renderDirect();document.getElementById('direct-student-'+id)?.focus();}
function directSelectAll(value){directState.students=value?directStudents[directState.className].map(s=>s.id):[];directResetPath();renderDirect();}
function directPickSection(id){if(!directState.students.length||directState.section===id)return;const section=directHierarchy.find(s=>s.id===id);if(!section?.groups.some(directAllowed))return;directState.section=id;directState.group=null;directState.item=null;renderDirect();}
function directPickGroup(name){const group=directHierarchy.find(s=>s.id===directState.section)?.groups.find(g=>g.name===name);if(!group||!directAllowed(group)||directState.group===name)return;directState.group=name;directState.item=null;renderDirect();}
function directPickItem(name){const group=directHierarchy.find(s=>s.id===directState.section)?.groups.find(g=>g.name===directState.group);if(!group?.items.includes(name))return;directState.item=name;renderDirect();}
function directReady(){return Boolean(directState.students.length&&directState.section&&directState.group&&directState.item);}
function updateDirectAction(){const button=document.getElementById('directSubmit');if(button){button.disabled=!directReady();button.textContent=`为 ${directState.students.length} 名学生各记 1 分`;}}
function directSubmit(){if(!directReady())return;const count=directState.students.length;const path=[directHierarchy.find(x=>x.id===directState.section).name,directState.group,directState.item].join(' → ');directState.success=`评分效果示意：${count}名学生各+1分 · ${path}。未写入真实数据，可继续选择下一批学生。`;directState.students=[];directResetPath();directState.reason='';renderDirect();toast('评分效果示意：未提交真实数据');}
function directClose(){directState.open=false;render();}
function renderDirect(){const focusId=document.activeElement?.id;render();if(focusId)document.getElementById(focusId)?.focus({preventScroll:true});}
function renderDirectPage(){
 const state=directState,section=directHierarchy.find(x=>x.id===state.section),group=section?.groups.find(x=>x.name===state.group),students=directStudents[state.className],names=students.filter(s=>state.students.includes(s.id)).map(s=>s.name);
 const esc=value=>String(value||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
 const studentPanel=`<section class="direct-students-panel"><h2>选择学生 <span class="badge">已选 ${names.length} 人</span></h2><p class="direct-help">可多选，先选学生再选择评价分类。</p><div class="direct-toolbar"><label>当前班级 <select aria-label="直评班级" onchange="directChangeClass(this.value)">${Object.keys(directStudents).map(name=>`<option ${name===state.className?'selected':''}>${name}</option>`).join('')}</select></label></div><div class="direct-toolbar"><button class="text-action" onclick="directSelectAll(true)">全选本班</button><button class="text-action" onclick="directSelectAll(false)">清空选择</button></div><div class="direct-choices" role="group" aria-label="选择直评学生">${students.map(s=>`<button id="direct-student-${s.id}" aria-pressed="${state.students.includes(s.id)}" onclick="directToggleStudent('${s.id}')"><b>${s.name}</b><small>${state.students.includes(s.id)?'✓ 已选择':'点击选择'}</small></button>`).join('')}</div></section>`;
 const sections=`<section class="direct-section"><h2>六育板块</h2><p class="direct-help">示意教师任教语文、道德与法治；真实系统按任教权限筛选。</p><div class="direct-choices" role="group" aria-label="选择六育板块">${directHierarchy.map(s=>{const available=state.students.length&&s.groups.some(directAllowed);return `<button id="direct-section-${s.id}" aria-pressed="${s.id===state.section}" ${available?'':'disabled'} onclick="directPickSection('${s.id}')"><b>${s.name}</b><small>${s.reason||(!state.students.length?'请先选择学生':available?'点击选择':'当前无任教权限')}</small></button>`}).join('')}</div></section>`;
 const primary=`<section class="direct-section"><h2>一级分类</h2>${section?`<div class="direct-choices" role="group" aria-label="选择一级分类">${section.groups.map((g,i)=>`<button id="direct-group-${i}" aria-pressed="${g.name===state.group}" ${directAllowed(g)?'':'disabled'} onclick="directPickGroup('${g.name}')"><b>${g.name}</b><small>${directAllowed(g)?g.items.length+'个二级指标':'当前无任教权限'}</small></button>`).join('')}</div>`:'<div class="direct-placeholder">选择六育板块后，在这里选择一级分类。</div>'}</section>`;
 const secondary=`<section class="direct-section"><h2>二级指标</h2>${group?`<div class="direct-choices" role="group" aria-label="选择二级指标">${group.items.map((item,i)=>`<button id="direct-item-${i}" aria-pressed="${item===state.item}" onclick="directPickItem('${item}')"><b>${item}</b><small>${item===state.item?'✓ 本次评价项':'点击选择'}</small></button>`).join('')}</div>`:'<div class="direct-placeholder">选择一级分类后，在这里选择二级指标。</div>'}</section>`;
 const confirmation=`<section class="direct-section"><h2>评分确认</h2><div class="direct-summary" aria-live="polite"><strong>已选学生 ${names.length} 人：</strong>${names.join('、')||'尚未选择'}<br><strong>评价路径：</strong>${[section?.name,state.group,state.item].filter(Boolean).join(' → ')||'尚未选择'}</div><label class="direct-reason" for="directReason">评价说明（选填）</label><textarea id="directReason" placeholder="有需要时补充本次表现，也可以直接留空。" oninput="directState.reason=this.value">${esc(state.reason)}</textarea><div class="direct-point">每名学生本次记 <b>1 分</b>，期末星级按学校规则自动折算。</div><div class="direct-submit-line"><span>${directReady()?'已选好学生和指标，可以直接评分。':'选好学生、六育、一级和二级后即可评分。'}</span><button id="directSubmit" class="primary" ${directReady()?'':'disabled'} onclick="directSubmit()">为 ${names.length} 名学生各记 1 分</button></div><p class="direct-check">交互示意 · 不提交真实评分；说明为空也可确认。</p></section>`;
 return adultShell('teacher',`<div class="direct-page"><div class="direct-page-toolbar"><p>同页选择学生与评价分类，完成后直接记分。</p><button class="secondary" onclick="directClose()">返回工作台</button></div>${state.success?`<div class="direct-success" role="status">${esc(state.success)}</div>`:''}<div class="direct-layout">${studentPanel}<section class="direct-rating-panel">${sections}${primary}${secondary}${confirmation}</section></div></div>`).replace('今天，先把这几件事做完','快速直评');
}
function openImport(kind){openModal(kind==='health'?'导入体测原始数据':'整班录入学业水平',`<p>${kind==='health'?'管理员导入身高、体重、左右视力、1分钟跳绳；原值不强转为等级。':'默认当前班级与任教学科，学生为行、评价分项为列；支持直接编辑与粘贴。'}</p><div class="release-steps" style="gap:15px"><span>① 选择 / 粘贴</span><span>② 检查差异</span><span>③ 确认提交</span></div><div class="task-row"><div><b>预览结果</b><small>36 行有效 · 2 行需要修正</small></div><span class="badge orange">定位到单元格</span></div><p>错误行与错误格直接高亮，保留正确输入，不清空整张表。</p>`,'查看导入示意','导入交互示意：统一主操作位于右下；有错误时不会默默部分成功');}
function openReview(kind){openModal(kind==='story'?'故事评分异常':'奖状认定',`<p>${kind==='story'?'左侧保留学生原文，右侧仅显示异常原因及评分量规。可重试系统评分，也可依据原文复核。':'原图与识别事实同屏，识别不确定的字段突出显示，教师只核对必要信息。'}</p><div class="task-row"><div><b>林小满 · 四年级（2）班</b><small>${kind==='story'?'我爱讲故事 · 10月':'劳动实践奖状 · 待认定'}</small></div><span class="badge orange">需处理</span></div><div class="form-demo"><label>认定 / 复核依据<textarea placeholder="需要人工判断时，填写简短依据"></textarea></label></div>`,'保存并处理下一条','处理完成示意：返回原待办位置，自动定位下一份本人可处理的材料');}
function openClass(){openModal('四年级（2）班 · 未完成事项',`<p>管理员只查看完成项与负责人，不打开学生健康值、故事正文或寄语。</p><div class="task-row"><span>故事评分异常</span><b>3 人 · 故事教师</b></div><div class="task-row"><span>奖状待认定</span><b>6 人 · 负责教师</b></div><p>已就绪报告不提前发布，全校准备完成后才统一可见。</p>`,'我知道了');}
function adultNav(button,type,name){document.querySelectorAll('.sidebar nav button').forEach(b=>b.classList.remove('active'));button.classList.add('active');if(name==='工作台'||name==='发布中心'){render();return;}if(name==='评价录入')openImport();else if(name==='班级报告')openModal('班级报告 · 缺什么，一眼看清',`<p>学生清单固定在左，右侧显示当前学生的缺项与报告预览；仅班主任出现本入口。</p><div class="task-row"><span>38 名学生</span><b>29 已就绪 · 9 待完成</b></div><p>寄语编辑、布局检查与确认在同一页完成，报告仍使用附件 PDF 六板块排版。</p>`,'查看确认流程');else if(name==='卡片管理')openModal('卡片计划，一次完成',`<p>管理员已下发：100 张。教师仅分配班级与细分方向。</p><div class="task-row"><span>四年级（2）班 · 学习兴趣</span><b>50 张</b></div><div class="task-row"><span>四年级（1）班 · 学习兴趣</span><b>50 张</b></div><p>保存计划后原地进入下一步，不再要求重新打开。生成后直接出现各班下载入口。</p>`,'保存并预览生成','卡片流程示意：分配 → 预览生成 → 按班下载，每一步都留在当前计划');else if(name==='数据与额度')openModal('数据与额度',`<p>用任务分组代替散落的菜单：学籍导入、体测导入、卡额度下发。</p><div class="task-row"><b>学籍与账号</b><span>按模板批量导入</span></div><div class="task-row"><b>体测原始值</b><span>预览并核对差异</span></div><div class="task-row"><b>月度卡额度</b><span>按教师批量下发</span></div>`,'查看任务入口');else openModal('学期配置 · 低频操作集中管理',`<p>学期、任教、规则、报到日期分组维护。教师和班级使用可搜索的名称选择，不要求记住数据库 ID。</p><div class="task-row"><b>教师</b><span>陈老师 · 语文</span></div><div class="task-row"><b>负责班级</b><span>四年级（1）、（2）班</span></div><p>修改评分规则前提示受影响范围，避免误以为保存后已确认报告仍然有效。</p>`,'查看配置示意');}
document.addEventListener('keydown',event=>{const modal=document.getElementById('modal');if(!modal.classList.contains('open'))return;if(event.key==='Escape')closeModal();if(event.key==='Tab'){const nodes=[...modal.querySelectorAll('button,input,textarea,select,[tabindex="0"]')];const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('modal'))){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
let selfStep=0,selfSaved=false,selfDone=false;
const selfAnswers={};
const selfGroups=[
 {title:'我的日常表现',desc:'想想这学期的自己，每项选一组星星就好。',items:[['conduct_politeness_self_star','有礼貌','见到师长、同学，我会主动问好。'],['conduct_civility_self_star','讲文明','我会注意言行，爱护公共环境。'],['conduct_integrity_self_star','讲信用','答应别人的事，我会认真做到。'],['conduct_responsibility_self_star','负责任','自己的事情，我会努力做好。'],['conduct_kindness_self_star','有爱心','别人需要帮助时，我愿意伸出手。'],['conduct_rules_self_star','守规则','学习、活动和出行时，我会遵守规则。'],['conduct_communication_self_star','善交流','我愿意表达想法，也认真听别人说。'],['conduct_cooperation_self_star','会合作','和同伴一起做事时，我愿意分工合作。']]},
 {title:'我的健康与运动',desc:'给自己的锻炼表现点星星，身体数据由学校填写。',items:[['fitness_self_star','体质健康测试','回想自己参加体测时的表现。'],['sports:demo-sports','足球 · 体育技能特长','来自已认定特长（示意）：评价自己的参与和表现。']]},
 {title:'我的音乐与美术',desc:'学习过程和艺术技能分别评价，不用填写老师的评价。',items:[['music_learning_self_star','音乐 · 学习过程','上音乐课时，我的参与和投入怎么样？'],['music_skill_self_star','音乐 · 艺术技能','这学期，我在音乐技能上表现怎么样？'],['fine_art_learning_self_star','美术 · 学习过程','上美术课时，我的参与和投入怎么样？'],['fine_art_skill_self_star','美术 · 艺术技能','这学期，我在美术技能上表现怎么样？'],['art:demo-art1','合唱 · 艺术特长','来自已认定特长（示意），按真实项目显示。'],['art:demo-art2','绘画 · 艺术特长','来自已认定特长（示意），不强制学生新增特长。']]}
];
const selfTexts=[['self_conduct_text','品行美','这学期，我做过的一件暖心事……'],['self_wisdom_text','智慧美','我学会的新本领或找到的好方法……'],['self_health_text','健康美','让我坚持下来的运动或健康习惯……'],['self_art_text','艺术美','一次让我开心的艺术体验……'],['self_labor_text','劳动美','我亲手完成的一次劳动……'],['semester_highlights','本学期最大的收获与活动','想一想最想记住的一次活动或收获。'],['next_term_goals','下学期，我想试着……','写下一个你愿意努力的小目标。']];
function openSelf(){selfStep=0;showStudent('self');document.querySelector('.self-intro h1')?.focus({preventScroll:true});window.scrollTo(0,0);}
function selfCounts(){const items=selfGroups.flatMap(g=>g.items);return {stars:items.filter(i=>selfAnswers[i[0]]).length,total:items.length,texts:selfTexts.filter(i=>(selfAnswers[i[0]]||'').trim()).length};}
function changeSelfStep(n){selfStep=n;render();document.querySelector('.self-intro')?.scrollIntoView({block:'start',behavior:'instant'});document.querySelector('.self-intro h1')?.focus();}
function setSelfStar(key,n){selfAnswers[key]=n;selfSaved=false;selfDone=false;const row=document.getElementById('self-row-'+key);row.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.n)===n)));updateSelfStatus();}
function setSelfText(key,value){selfAnswers[key]=value;selfSaved=false;selfDone=false;const count=document.getElementById('count-'+key);if(count)count.textContent=[...value].length+' / '+(key==='family_message'?1000:2000);updateSelfStatus();}
function updateSelfStatus(){const c=selfCounts();document.querySelectorAll('[data-self-progress]').forEach(el=>el.textContent=`已选 ${c.stars} / ${c.total} 项星级 · 已写 ${c.texts} / 7 项文字`);const status=document.getElementById('selfSaveStatus');if(status)status.textContent=selfSaved?'示意：当前输入已记在本页内存，刷新将清空':'示意：尚未点击保存，刷新将清空';}
function saveSelfDemo(){selfSaved=true;updateSelfStatus();toast('填写已在本页内存暂存；这是示意页，未发送到真实系统');}
function finishSelfDemo(){const c=selfCounts();if(c.stars<c.total||c.texts<7){toast(`还有 ${c.total-c.stars} 项星级、${7-c.texts} 项文字待填；也可以先保存再慢慢写`);return;}selfDone=true;selfSaved=true;render();toast('完成效果示意：正式版将在服务器保存成功后显示完成');}
function renderSelfForm(){const c=selfCounts();const intro=selfStep<3?selfGroups[selfStep]:{title:'把成长写进手账',desc:'可以慢慢写，也可以粘贴文字。不需要写很长，真实就好。'};let body='';if(selfStep<3){body=`<section class="card"><div class="card-title"><h2>${intro.title}</h2><span class="badge">第 ${selfStep+1} / 4 步</span></div><div class="self-help">每项选择 ★、★★ 或 ★★★；想好了再选，不默认打满星。</div>${intro.items.map(([key,label,hint])=>`<div class="star-row" id="self-row-${key}"><div class="star-name"><b>${label}</b><small>${hint}</small></div><div class="star-group" role="group" aria-label="${label}自评">${[1,2,3].map(n=>`<button data-n="${n}" aria-label="${label} ${n}星" aria-pressed="${selfAnswers[key]===n}" onclick="setSelfStar('${key}',${n})">${'★'.repeat(n)}<span>${n} 星</span></button>`).join('')}</div></div>`).join('')}</section>`;}else{const esc=v=>String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const input=([key,label,hint])=>`<label for="text-${key}">${label}<textarea id="text-${key}" placeholder="${hint}" maxlength="2000" oninput="setSelfText('${key}',this.value)">${esc(selfAnswers[key])}</textarea></label><div class="counter" id="count-${key}">${[...(selfAnswers[key]||'')].length} / 2000</div>`;body=`<section class="card self-text"><h2>我的五方面收获</h2><p class="caption">展开一项，记下一件自己的事。五项文字会分别出现在报告正面。</p>${selfTexts.slice(0,5).map((item,i)=>`<details ${i===0?'open':''}><summary>${['☀','✦','●','♫','✿'][i]} ${item[1]}${(selfAnswers[item[0]]||'').trim()?' · 已填写':''}</summary>${input(item)}</details>`).join('')}${selfTexts.slice(5).map(input).join('')}<details><summary>家长寄语 · 家长协助填写（可选）</summary>${input(['family_message','想对孩子说的话','给孩子写下一句鼓励吧。'])}</details></section>`;}
return `<div class="self-form"><div class="self-top"><button class="text-action self-back" onclick="showStudent('home')">← 返回首页</button><span class="badge blue" data-self-progress>已选 ${c.stars} / ${c.total} 项星级 · 已写 ${c.texts} / 7 项文字</span></div><div class="self-intro"><div class="self-mascot">${mascot}</div><div><div class="eyebrow">给自己点星星 · 成长手账</div><h1 tabindex="-1">${intro.title}</h1><p>${intro.desc}</p></div></div><nav class="self-steps" aria-label="自我评价步骤">${['日常表现','健康运动','音乐美术','收获目标'].map((name,i)=>`<button ${selfStep===i?'aria-current="step"':''} onclick="changeSelfStep(${i})"><b>${['✦','●','♫','✿'][i]}</b>${name}</button>`).join('')}</nav>${selfDone?'<div class="self-done">✦ 这份成长手账已经写好啦！<br><small>示意状态；正式系统保存成功后才显示完成。</small></div>':''}${body}<div class="self-actions"><span class="self-save-status" id="selfSaveStatus">${selfSaved?'示意：当前输入已记在本页内存，刷新将清空':'示意：尚未点击保存，刷新将清空'}</span><div class="button-line">${selfStep>0?'<button class="secondary" onclick="changeSelfStep(selfStep-1)">上一步</button>':''}<button class="secondary" onclick="saveSelfDemo()">先保存</button>${selfStep<3?'<button class="primary" onclick="changeSelfStep(selfStep+1)">下一步 →</button>':'<button class="primary" onclick="finishSelfDemo()">完成自我评价</button>'}</div></div></div>`;}
const cardMonthData={'2026-09':{quota:90,generated:90},'2026-10':{quota:100,generated:80},'2026-11':{quota:120,generated:60}};
const cardExamples=Object.entries(cardMonthData).flatMap(([month,data])=>Array.from({length:data.generated},(_,i)=>{const half=data.generated/2,local=i%half+1,cls=i<half?'四年级（2）班':'四年级（1）班',used=month==='2026-10'?local<=(i<half?28:24):month==='2026-09'?local<=35:false,voided=month==='2026-10'&&local===half;const category=['CHINESE_INTEREST_STAR','CHINESE_HABIT_STAR','CONDUCT_POLITENESS_OTHER_STAR'][i%3];const map={CHINESE_INTEREST_STAR:['智美少年','语文','学习兴趣'],CHINESE_HABIT_STAR:['智美少年','语文','学习习惯'],CONDUCT_POLITENESS_OTHER_STAR:['德美少年','日常行为','有礼貌']};return {id:month.replace('-','')+'-0042-'+String(i+1).padStart(4,'0'),month,cls,section:map[category][0],primary:map[category][1],secondary:map[category][2],category,status:used?'USED':voided?'VOID':month==='2026-09'?'EXPIRED':month==='2026-11'?'FUTURE':'UNUSED',student:used?(i<half?['林小满','张予安','沈知夏']:['刘安安','方沐阳','周星禾'])[i%3]:'',studentId:used?'2026'+(i<half?'02':'01')+String(i%3+1).padStart(2,'0'):'',usedAt:used?month+'-'+String(5+(i%20)).padStart(2,'0')+' 14:30':'',generatedAt:month==='2026-11'?'2026-10-28 09:00':month+'-01 09:00',reversed:month==='2026-10'&&local===1,net:used?month==='2026-10'&&local===1?0:1:0};}));
let cardUI={open:false,tab:'overview',month:'2026-10',cls:'all',primary:'all',secondary:'all',status:'all',keyword:'',view:'cards',page:1};
function cardEsc(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
function openCardLedger(){reportUI.open=false;directState.open=false;cardUI.open=true;render();window.scrollTo(0,0);}
function cardTab(tab){cardUI.tab=tab;render();}
function cardMonth(month){cardUI.month=month;cardUI.page=1;render();}
function cardRows(){return cardExamples.filter(c=>c.month===cardUI.month&&(cardUI.cls==='all'||c.cls===cardUI.cls)&&(cardUI.primary==='all'||c.primary===cardUI.primary)&&(cardUI.secondary==='all'||c.secondary===cardUI.secondary)&&(cardUI.status==='all'||cardUI.status==='REVERSED'?cardUI.status==='REVERSED'?c.reversed:true:c.status===cardUI.status)&&(!cardUI.keyword||[c.id,c.student,c.studentId].some(v=>v.includes(cardUI.keyword))));}
function applyCardFilters(){for(const key of ['cls','primary','secondary','status','keyword'])cardUI[key]=document.getElementById('card-filter-'+key).value.trim();cardUI.page=1;render();}
function resetCardFilters(){Object.assign(cardUI,{cls:'all',primary:'all',secondary:'all',status:'all',keyword:'',page:1});render();}
function cardDrill(cls,status='all'){Object.assign(cardUI,{tab:'details',cls:cls||'all',status,primary:'all',secondary:'all',keyword:'',view:'cards',page:1});render();}
function cardView(view){cardUI.view=view;cardUI.page=1;render();}
function cardStatus(card){return card.reversed?'已领取 · 已冲正':({USED:'已领取',UNUSED:'待领取',EXPIRED:'过期未领',VOID:'已作废',FUTURE:'未到领取期'})[card.status];}
function cardGrouped(rows,view){const out=new Map();for(const row of rows){const key=view==='students'?row.studentId:row.cls+'|'+row.category;if(view==='students'&&!row.studentId)continue;if(!out.has(key))out.set(key,{name:view==='students'?row.student:row.primary+' · '+row.secondary,cls:row.cls,rows:[]});out.get(key).rows.push(row);}return [...out.values()];}
function cardTable(rows,view='cards',print=false){
 let headings,body;
 if(view==='cards'){headings=['卡编号','班级','评价方向','领取学生','状态','有效积分','领取时间',...(print?[]:['操作'])];body=rows.map(c=>`<tr><td>${c.id}</td><td>${c.cls}</td><td>${c.primary}<small>${c.secondary}</small></td><td>${c.student||'尚未领取'}${c.studentId?`<small>${c.studentId}</small>`:''}</td><td><span class="ledger-badge ${c.reversed?'warn':c.status==='USED'?'':'muted'}">${cardStatus(c)}</span></td><td>${c.net}</td><td>${c.usedAt||'—'}</td>${print?'':`<td><button class="text-action" onclick="cardDetail('${c.id}')">查看详情</button></td>`}</tr>`).join('');}
 else{headings=view==='students'?['学生','班级','扫码领取','已冲正','有效积分']:['评价方向','班级','已制卡','学生已领取','领取学生数','有效积分'];body=cardGrouped(rows,view).map(g=>`<tr><td>${g.name}</td><td>${g.cls}</td>${view==='students'?`<td>${g.rows.filter(c=>c.status==='USED').length}</td><td>${g.rows.filter(c=>c.reversed).length}</td>`:`<td>${g.rows.length}</td><td>${g.rows.filter(c=>c.status==='USED').length}</td><td>${new Set(g.rows.filter(c=>c.studentId).map(c=>c.studentId)).size}</td>`}<td>${g.rows.reduce((a,c)=>a+c.net,0)}</td></tr>`).join('');}
 return `<table><thead><tr>${headings.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headings.length}">暂无符合条件的数据</td></tr>`}</tbody></table>`;
}
function cardDetail(id){const c=cardExamples.find(c=>c.id===id);openModal('卡片流向 · '+c.id,`<div class="ledger-detail-list"><p><b>教师获配：</b>陈老师 · ${c.month} · 月度额度${cardMonthData[c.month].quota}张</p><p><b>发行班级：</b>${c.cls}</p><p><b>评价方向：</b>${c.section} → ${c.primary} → ${c.secondary}</p><p><b>当前状态：</b>${cardStatus(c)} · 有效积分${c.net}</p><p><b>领取学生：</b>${c.student||'尚未领取'} ${c.studentId}</p><p><b>生成：</b>${c.generatedAt}<br><b>学生领取：</b>${c.usedAt||'—'}</p>${c.reversed?'<p>冲正示意：教师确认重复评价，原领取事实保留，净分为0。</p>':''}<p>编号用于追溯，台账不显示可领取凭证。全部为示例数据。</p></div>`,'关闭详情');}
function cardFilterText(){return `额度月 ${cardUI.month} / ${cardUI.cls==='all'?'全部班级':cardUI.cls} / ${cardUI.primary==='all'?'全部一级':cardUI.primary} / ${cardUI.secondary==='all'?'全部二级':cardUI.secondary} / ${cardUI.status==='all'?'全部状态':cardUI.status} / 关键词 ${cardUI.keyword||'无'}`;}
function exportCardExample(){const rows=cardRows(),text=value=>{const v=String(value??'');return '"'+(/^[=+\-@]/.test(v)?"'"+v:v).replaceAll('"','""')+'"'};const lines=[['云美卡片台账（示例数据，不是真实业务）'],[cardFilterText()],['卡编号','额度月份','教师','班级','六育','一级','二级','学生','学号','状态','领取时间','生成时间','有效积分'],...rows.map(c=>[c.id,c.month,'陈老师',c.cls,c.section,c.primary,c.secondary,c.student,c.studentId,cardStatus(c),c.usedAt,c.generatedAt,c.net])];const blob=new Blob(['\uFEFF'+lines.map(row=>row.map(text).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`云美_示例_${cardUI.month}_卡片明细.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(`已导出当前筛选的全部 ${rows.length} 张示例卡，非真实数据`);}
function printCardLedgerExample(){const rows=cardRows();openModal('卡片台账打印预览',`<div class="ledger-print-sheet"><h3>云美 · 陈老师 ${cardUI.month} 卡片台账（示例）</h3><p>${cardEsc(cardFilterText())}；共${rows.length}张，数据截至2026-10-28（Asia/Shanghai）。仅用于版面评审。</p>${cardTable(rows,'cards',true)}</div>`,'打印 / 保存 PDF');document.getElementById('modal').classList.add('ledger-print');document.getElementById('modalPrimary').onclick=()=>window.print();}
function renderCardsPage(){
 const all=cardExamples.filter(c=>c.month===cardUI.month),quota=cardMonthData[cardUI.month].quota,used=all.filter(c=>c.status==='USED').length,pending=all.filter(c=>c.status==='UNUSED').length,expired=all.filter(c=>c.status==='EXPIRED').length,voided=all.filter(c=>c.status==='VOID').length,reversed=all.filter(c=>c.reversed).length,rows=cardRows();
 const overview=`<div class="ledger-stats">${[['教师获配',quota,'管理员下发的月度额度',"cardTab('overview')"],['已制卡',all.length,'已生成的原卡张数',"cardDrill('all')"],['学生已领取',used,'扫码确认，含已冲正',"cardDrill('all','USED')"],['待领取',pending,'当前有效、尚未领取',"cardDrill('all','UNUSED')"],['剩余未制卡额度',quota-all.length,'生成后计划锁定，不能直接增补',"cardTab('print')"]].map(([name,note,caption,action])=>`<button class="ledger-stat" onclick="${action}"><span>${name}</span><strong>${note}</strong><small>${caption}</small></button>`).join('')}</div><p class="ledger-note">全月统计 · 过期未领 ${expired} 张 · 已作废 ${voided} 张 · 已冲正 ${reversed} 张 · 纸卡有效积分 ${used-reversed} 分。已制卡不代表纸卡已交到学生手中。</p><section class="ledger-panel"><div class="ledger-row-head"><h2>卡片分给哪些班，用在哪些学生？</h2><button class="text-action" onclick="cardTab('details')">查看全部流向 →</button></div><div class="ledger-table-wrap"><table><thead><tr><th>班级</th><th>计划 / 已制卡</th><th>学生已领取</th><th>待领取</th><th>有效积分</th><th>操作</th></tr></thead><tbody>${['四年级（2）班','四年级（1）班'].map(cls=>{const r=all.filter(c=>c.cls===cls);return `<tr><td>${cls}</td><td>${r.length} / ${r.length}</td><td>${r.filter(c=>c.status==='USED').length}</td><td>${r.filter(c=>c.status==='UNUSED').length}</td><td>${r.reduce((a,c)=>a+c.net,0)}</td><td><button class="text-action" onclick="cardDrill('${cls}')">追溯学生与指标</button></td></tr>`}).join('')}</tbody></table></div><p class="ledger-note">未分配额度 ${quota-all.length} 张。计划已生成锁定；剩余额度不等于可直接再次生成。</p></section><section class="ledger-panel"><h2>月度额度与生成记录</h2><div class="ledger-time-line"><span><b>管理员下发额度</b>　${quota} 张</span><small>${cardUI.month==='2026-11'?'2026-10-28':cardUI.month+'-01'} 08:30 · 学校管理员（示例）</small></div><div class="ledger-time-line"><span><b>教师生成卡片</b>　${all.length} 张 · 2个班</span><small>${all[0].generatedAt} · 陈老师（示例）</small></div><p class="ledger-note">真实系统没有保留的历史调整不会补造记录。补打和原卡共享同一次领取资格。</p></section>`;
 const opt=(value,label,current)=>`<option value="${value}" ${current===value?'selected':''}>${label}</option>`;

 const viewRows=cardUI.view==='cards'?rows.slice((cardUI.page-1)*25,cardUI.page*25):rows;
 const detail=`${filters}<section class="ledger-panel"><div class="ledger-row-head"><h2>使用流向</h2><div class="ledger-view">${[['cards','逐张卡片'],['students','按学生'],['indicators','按指标']].map(([v,n])=>`<button aria-pressed="${v===cardUI.view}" onclick="cardView('${v}')">${n}</button>`).join('')}</div></div><div class="ledger-range">${cardEsc(cardFilterText())}<br>共 ${rows.length} 张 · 学生已领取 ${rows.filter(c=>c.status==='USED').length} 张 · 有效积分 ${rows.reduce((a,c)=>a+c.net,0)} 分。导出/打印按此筛选的全部结果，不只当前页。</div><div class="ledger-table-wrap">${cardTable(viewRows,cardUI.view)}</div>${cardUI.view==='cards'?`<div class="ledger-pager"><span>第${cardUI.page}页 · 每页25条</span><div class="ledger-tools"><button class="secondary" ${cardUI.page<=1?'disabled':''} onclick="cardUI.page--;render()">前一页</button><button class="secondary" ${cardUI.page*25>=rows.length?'disabled':''} onclick="cardUI.page++;render()">后一页</button></div></div>`:''}<p class="ledger-note">无卡直评与冲正会在正式版“评价记录”单列，不计入已制卡张数。本页所有流向为示例。</p></section>`;
 const printing=`<section class="ledger-panel"><h2>已生成的月度计划</h2><p class="ledger-note">教师获配 ${quota} 张 · 已制卡 ${all.length} 张 · 剩余 ${quota-all.length} 张。当前计划已生成，不能修改或直接增补；需变更时联系管理员。</p><div class="ledger-plan">${['四年级（2）班','四年级（1）班'].map(cls=>`<div class="card"><h2>${cls}</h2><p>${all.filter(c=>c.cls===cls).length}张原卡；按班独立PDF。</p><p class="caption">语文：学习兴趣 / 学习习惯<br>德美：有礼貌</p><button class="secondary" onclick="toast('示意：正式版下载该班仍有效未领取的原卡PDF，原凭证不变')">打印该班积分卡</button></div>`).join('')}</div><div class="ledger-tools"><button class="primary" onclick="toast('示意：正式版下载ZIP，内含每班独立PDF；本原型没有真实可领取凭证')">下载全部班级积分卡</button><button class="secondary" onclick="cardDrill('all','UNUSED')">查看待领取卡</button></div><div class="direct-point">补打使用原卡编号和原二维码，不生成新卡、不重复记分。已领取/失效卡不再打印为可领取卡。</div></section>`;

function renderReportWorkspace(){
 const count=reportExamples.length,ready=reportExamples.filter(s=>s.status!=='INCOMPLETE').length,confirmed=reportExamples.filter(s=>s.status==='CONFIRMED').length;const classes=[...new Set(reportExamples.map(s=>s.classKey))];let content;
 if(!reportUI.studentId){const students=reportFilteredStudents();content=`<div class="report-workspace-head"><p>当前教师负责的全部班级 · 任课教师只读明细，班主任可编辑寄语与确认。</p><span class="badge">每班3名虚构示例学生</span></div><div class="report-overview"><div>负责班级<b>${classes.length}</b></div><div>学生报告<b>${count}</b></div><div>数据就绪<b>${ready}</b></div><div>已确认待发布<b>${confirmed}</b></div></div><div class="report-workspace-grid"><aside class="report-class-list" aria-label="负责班级列表"><h2>全部负责班级</h2><button aria-pressed="${reportUI.classKey==='all'}" onclick="selectReportClass('all')"><b>全部班级</b><small>${classes.length}个班 · ${count}名学生</small></button>${classes.map(cls=>{const rows=reportExamples.filter(s=>s.classKey===cls);return `<button aria-pressed="${reportUI.classKey===cls}" onclick="selectReportClass('${cls}')"><b>${cls}</b><small>${rows[0].isHead?'班主任':'任课教师'} · ${rows.length}名学生</small><small>就绪 ${rows.filter(s=>s.status!=='INCOMPLETE').length} / ${rows.length} · 已确认 ${rows.filter(s=>s.status==='CONFIRMED').length}</small></button>`}).join('')}</aside><section class="report-student-list"><h2 style="font-size:18px;margin:0 0 17px">${reportUI.classKey==='all'?'全部班级 · 学生报告':reportUI.classKey+' · 学生报告'}</h2><div class="report-list-filters"><input id="report-search" aria-label="搜索报告学生" placeholder="搜索学生姓名或学号" value="${cardEsc(reportUI.keyword)}" onkeydown="if(event.key==='Enter')applyReportFilter()"><select id="report-status" aria-label="报告状态筛选">${[['all','全部状态'],['INCOMPLETE','待补齐'],['READY','待确认'],['CONFIRMED','已确认待发布'],['PUBLISHED','已发布']].map(([value,label])=>`<option value="${value}" ${reportUI.status===value?'selected':''}>${label}</option>`).join('')}</select><button class="secondary" onclick="applyReportFilter()">查询</button></div><p class="report-list-caption">共${students.length}份 · 六板块显示已填/适用项数，不计算新的六育总分。点击学生姓名查看PDF式明细。</p><div class="ledger-table-wrap"><table class="report-student-table"><thead><tr><th>学生</th><th>六板块简要报告</th><th>完成与确认</th><th>操作</th></tr></thead><tbody>${students.map(s=>`<tr><td><button id="report-student-${s.id}" class="student-name-link" onclick="reportUI.lastStudent='${s.id}';openStudentReport('${s.id}')">${s.name}</button><small>${s.number}</small><small>${s.classKey}</small></td><td><div class="report-section-mini">${Object.entries(reportSectionLabels).map(([key,label])=>`<span class="${s.progress[key].filled<s.progress[key].total?'missing':''}">${label} ${s.progress[key].filled}/${s.progress[key].total}</span>`).join('')}</div><small>A等级 ${s.gradeA}项 · 三星 ${s.star3}项</small></td><td><span class="ledger-badge ${s.status==='INCOMPLETE'?'warn':''}">${reportStatusLabel(s)}</span><small>${s.missingCount?'待补 '+s.missingCount+' 项':'必需项已齐全'}</small><small>学期寄语${s.commentReady?'已填':'待班主任填写'}</small></td><td><button class="secondary" onclick="reportUI.lastStudent='${s.id}';openStudentReport('${s.id}')">查看报告 →</button></td></tr>`).join('')||'<tr><td colspan="4"><div class="report-empty">没有符合条件的学生报告</div></td></tr>'}</tbody></table></div><p class="report-demo-label">报告状态与发布分开；本示例均未全校发布。实际列表按服务端全量统计与分页返回。</p></section></div>`;}
 else{const s=reportExamples.find(x=>x.id===reportUI.studentId);content=`<div class="report-breadcrumb">班级报告 / ${s.classKey} / ${s.name}</div><div class="report-detail-toolbar"><button class="secondary" onclick="backToReportList()">← 返回学生列表</button><div class="button-line"><button class="secondary" onclick="printStudentReport(true)">导出 PDF</button><button class="primary" onclick="printStudentReport(false)">打印报告</button></div></div><div class="report-detail-ident"><div><h2>${s.name} · 六育评价报告</h2><p>${s.classKey} · ${s.number} · 2026—2027 第一学期</p></div><span class="ledger-badge ${s.status==='INCOMPLETE'?'warn':''}">${reportStatusLabel(s)}</span></div><div class="report-draft-note">${s.missingCount?'仍有'+s.missingCount+'项待补齐；':'必需数据已齐全；'}当前为虚构示例草稿，未全校发布。草稿标识会进入打印内容。${s.isHead?'你是本班班主任，可编辑学期寄语并按规则确认。':'你是本班任课教师，可查看和导出六育明细；寄语及确认由班主任负责。'}</div><div class="report-preview-options"><label>查看范围<select aria-label="报告查看范围" onchange="changeReportScope(this.value)"><option value="detail" ${reportUI.scope==='detail'?'selected':''}>六育评价明细</option>${s.isHead?`<option value="full" ${reportUI.scope==='full'?'selected':''}>完整正反面报告</option>`:''}</select></label><small id="report-export-scope">当前范围：六育评价明细 · A4横向1页</small></div><p class="report-demo-label">正文由现有报告渲染器生成，保持学校PDF六板块、合并表头、自评/他评与星级等级格式。</p><div class="report-render-frame"><iframe id="studentReportFrame" title="${s.name}六育评价明细" sandbox="allow-same-origin allow-modals"></iframe></div><section class="report-detail-management"><h3>报告核对与确认</h3><p>${s.isHead?'保存修改后，正式版重新核对缺项、页面溢出和最新确认指纹。':'只读查看；本班班主任负责学期寄语和最终确认。'}</p>${s.isHead?`<div class="button-line"><button class="secondary" onclick="reportCommentDemo()">编辑学期寄语</button><button class="primary" ${s.missingCount?'disabled':''} onclick="toast('确认流程示意：正式系统会校验权限、缺项、布局与指纹；本页不改变真实状态')">${s.status==='CONFIRMED'?'已确认 · 查看核对说明':'确认本报告（示意）'}</button></div>`:'<span class="badge">当前为任课教师只读模式</span>'}</section>`;}
 return adultShell('teacher',content).replace('今天，先把这几件事做完',reportUI.studentId?'学生报告详情':'班级报告');
}
render();
</script>
</body></html>
